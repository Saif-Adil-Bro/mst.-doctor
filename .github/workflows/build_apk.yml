name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required for modern AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Setup Gradle with automatic cache & optimization
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Inject Firebase google-services.json from Secret (if provided)
      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Injecting google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          else
            echo "Using bundled fallback google-services.json template..."
          fi

      # Step 5: Ensure gradlew exists and has execute permissions
      - name: Make Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # Step 6: Build Debug APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 7: Upload APK artifact for easy download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthKnowledge-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
